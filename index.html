<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakelit lemezek</title>
    <link rel="stylesheet" href="assets/style/style.css">

</head>

<body>
    <header>
        <!--Logo és később esetleg menü-->
        <img class="logo" src="assets/img/vinyl-record.png" alt="vinyl-record" width="30vw">
        <!--Cím-->
        <h1>Bakelit lemezeim</h1>
    </header>
    <main>
        <div class="bakelit-lemez">
            <div class="bakelit bakelit-test"></div>
            <div class="bakelit barazda barazda-1"></div>
            <div class="bakelit barazda barazda-2"></div>
            <div class="bakelit barazda barazda-3"></div>
            <div class="bakelit barazda barazda-4"></div>
            <div class="bakelit barazda barazda-5"></div>
            <div class="bakelit barazda barazda-6"></div>
            <div class="bakelit lemez-cimke"></div>
            <div class="bakelit belso-gyuru"></div>
            <div class="bakelit kozponti-lyuk"></div>
            <!--Lyuk, de az egyenlőre elmarad-->
        </div>
        <div class="hangszedo">
            <div class="fej">
                <div class="felnyil"></div>
                <div class="hagnszedo-fej"></div>
                <div class="lenyil"></div>
            </div>
            <div class="hagnszedo-test"></div>
        </div>

        <div class="card">
            <div class="first-row">
                <div class="cim">
                    <h2 id="valami" class="cim">
                        Hozier
                    </h2>
                    <h3>Unreal Unearth</h3>
                    <p>2023</p>
                    <p>Alternative Rock</p>
                </div>
                <img src="assets/img/hozier-unreal-unearth.jpg" alt="">
            </div>
            <div class="second-row nicescrool">
                
            </div>
        </div>
        
    </main>

<script src="assets/js/script.js"></script>
</body>

</html>
